[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nagasynapse"
version = "0.1.0"
description = "Synapse-style configurator for the Razer Naga V2 Pro and Naga Pro on Linux: onboard profiles, button remapping and macros"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.5"]

[project.scripts]
nagasynapse-cli = "nagasynapse.cli:main"

[project.gui-scripts]
nagasynapse = "nagasynapse.gui.app:main"

[tool.setuptools.packages.find]
include = ["nagasynapse*"]

[tool.setuptools.package-data]
nagasynapse = ["assets/*.svg"]
